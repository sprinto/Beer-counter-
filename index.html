<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241309"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Beer Counter"><title>Löwet Oktoberfest 26 🍺</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff5dc;background:#241309}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#76431c,#241309 72%);display:flex;justify-content:center}main{width:min(100%,480px);padding:28px 20px 36px;text-align:center}h1{font-size:2.3rem;margin:12px 0 0}p{color:#f7d9a5}.count{font-size:clamp(5rem,24vw,8rem);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 #593015}.mug{display:block;font-size:8rem;margin:12px auto;cursor:pointer;border:0;background:none;filter:drop-shadow(0 14px 8px #0005);transition:transform .15s}.mug:active{transform:rotate(-12deg) scale(1.1)}.primary{width:100%;border:0;border-radius:20px;padding:21px;font-size:1.6rem;font-weight:800;color:#321803;background:linear-gradient(#ffe17d,#ffad16);box-shadow:0 7px 0 #a75a05;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #a75a05}.buttons{display:flex;gap:12px;margin-top:22px}.buttons button{flex:1;padding:14px 8px;background:#fff2d91a;border:1px solid #ffe2a866;border-radius:14px;color:#fff1d7;font-size:1rem}.settings{margin:20px 0;color:#ffe7c0}.meta{margin-top:25px;font-size:.9rem;color:#e5c69b}.toast{min-height:30px;font-weight:700;color:#ffe17d}.bubble{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.18) rotate(8deg)}}button{touch-action:manipulation} 
</style></head><body><main><h1>🍻 Löwet Oktoberfest 26</h1><p>En öl i taget. Skål!</p><button class="mug" id="mug" aria-label="Lägg till en öl">🍺</button><div class="count" id="count">0</div><p>mina öl</p><div style="padding:14px;background:#fff2d91a;border-radius:18px;margin:12px 0"><div style="font-size:.9rem">🍻 ALLAS ÖL</div><div id="total" style="font-size:3.6rem;font-weight:900">—</div><small id="sync">Gemensam räknare väntar på anslutning</small></div><button class="primary" id="add">+ 1 ÖL 🍺</button><div class="buttons"><button id="undo">↩ Ångra</button><button id="reset">🔄 Ny kväll</button></div><label class="settings"><input type="checkbox" id="sound" checked> 🔊 Slumpmässiga ljud</label><div class="toast" id="toast" aria-live="polite"></div><div class="meta" id="meta"></div></main>
<script src="config.js"></script><script>
const key='beer-counter-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{count:0,started:null}}catch{state={count:0,started:null}}
const el=id=>document.getElementById(id);const cfg=window.BEER_BACKEND||{};const connected=!!(cfg.url&&cfg.anonKey);let device=localStorage.getItem('beer-device-id');if(!device){device=crypto.randomUUID();localStorage.setItem('beer-device-id',device)}let busy=false;async function sync(delta=0){if(!connected){el('sync').textContent='Gemensam databas är inte konfigurerad';return}if(busy)return;busy=true;try{const response=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/rpc/beer_change',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey},body:JSON.stringify({p_device:device,p_delta:delta})});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const v=Array.isArray(data)?data[0]:data;if(!v)throw new Error('Tomt svar');state.count=v.my_count;save();render();el('total').textContent=v.all_count;el('sync').textContent='Uppdaterad '+new Date().toLocaleTimeString('sv-SE')}catch(e){el('sync').textContent='Synkronisering misslyckades: '+e.message}finally{busy=false}}const save=()=>localStorage.setItem(key,JSON.stringify(state));const render=()=>{el('count').textContent=state.count;el('meta').textContent=state.started?'Kvällen började '+new Date(state.started).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):'Redo för kvällens första öl'};
const cheers=[['Skål!','sv-SE'],['Prost!','de-DE'],['Cheers!','en-GB'],['Salud!','es-ES'],['Santé!','fr-FR'],['Cin cin!','it-IT'],['Kippis!','fi-FI'],['Na zdrowie!','pl-PL'],['Noch ein Bier, bitte!','de-DE']];
let audio;function tone(f,t,d,type='sawtooth'){const a=audio||(audio=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t);g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.15,a.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.02)}
function play(){if(!el('sound').checked)return;const choice=Math.floor(Math.random()*4);try{if(choice===0){el('toast').textContent='BUUURP! 🤭';[115,82,63,95].forEach((f,i)=>tone(f,i*.13,.2))}else if(choice===1){el('toast').textContent='Joddel-aj-ihuu! 🏔️';[420,680,510,780,530,870].forEach((f,i)=>tone(f,i*.13,.18,'sine'))}else{const [words,lang]=choice===3?['Noch ein Bier, bitte!','de-DE']:cheers[Math.floor(Math.random()*cheers.length)];el('toast').textContent=words+' 🥂';if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words);u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}}}catch(e){el('toast').textContent='Skål! 🍻'}}
function add(){if(busy)return;if(!state.started)state.started=Date.now();if(!connected){state.count++;save();render()}else{sync(1)}el('mug').classList.remove('bubble');void el('mug').offsetWidth;el('mug').classList.add('bubble');play();if(navigator.vibrate)navigator.vibrate(30)}
el('add').onclick=add;el('mug').onclick=add;el('undo').onclick=()=>{if(state.count>0){if(connected)sync(-1);else{state.count--;if(!state.count)state.started=null;save();render()}el('toast').textContent='En öl ångrad ↩'}};el('reset').onclick=()=>{if(connected){alert('Den gemensamma kvällen kan inte nollställas från en enskild telefon.');return}if(confirm('Starta en ny kväll och nollställ räknaren?')){state={count:0,started:null};save();render();el('toast').textContent='Ny kväll! 🍺'}};render();sync();if(connected)setInterval(()=>sync(),5000);
</script></body></html>
